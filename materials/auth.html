<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In | Study with Jasmine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                "DM Sans",
                "Noto Sans SC",
                sans-serif;

            color: #44383c;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(247, 219, 227, 0.75),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255, 235, 190, 0.6),
                    transparent 28%
                ),
                #fffafb;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* ==========================
           NAVBAR
        ========================== */

        .navbar {
            height: 82px;

            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255, 250, 251, 0.94);

            border-bottom: 1px solid #eedfe3;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: #d85f7e;

            color: white;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-text strong {
            font-size: 15px;
        }

        .brand-text small {
            margin-top: 2px;

            color: #88777d;

            font-size: 10px;
        }

        .back-button {
            padding: 10px 16px;

            border: 1px solid #eedfe3;

            border-radius: 10px;

            background: white;

            font-size: 12px;
            font-weight: 700;
        }


        /* ==========================
           PAGE
        ========================== */

        .auth-page {
            min-height: calc(100vh - 82px);

            padding: 60px 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .auth-container {
            width: 100%;
            max-width: 440px;
        }


        /* ==========================
           HEADER
        ========================== */

        .auth-header {
            margin-bottom: 25px;

            text-align: center;
        }

        .auth-logo {
            width: 54px;
            height: 54px;

            margin: 0 auto 18px;

            display: grid;
            place-items: center;

            border-radius: 16px;

            background: #fff0f3;

            color: #d85f7e;

            font-size: 22px;
            font-weight: 700;
        }

        .auth-header h1 {
            font-size: 34px;

            letter-spacing: -0.04em;
        }

        .auth-header p {
            margin-top: 8px;

            color: #88777d;

            font-size: 13px;
        }


        /* ==========================
           CARD
        ========================== */

        .auth-card {
            padding: 30px;

            border: 1px solid #eedfe3;

            border-radius: 20px;

            background: rgba(255,255,255,0.96);

            box-shadow:
                0 20px 60px rgba(91,57,67,0.08);
        }


        /* ==========================
           TABS
        ========================== */

        .auth-tabs {
            margin-bottom: 26px;

            padding: 4px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            border-radius: 11px;

            background: #fff1f4;
        }

        .tab-button {
            height: 42px;

            border: 0;
            border-radius: 8px;

            background: transparent;

            color: #88777d;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .tab-button.active {
            background: white;

            color: #d85f7e;

            box-shadow:
                0 4px 12px rgba(91,57,67,0.06);
        }


        /* ==========================
           FORM
        ========================== */

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            outline: none;

            border: 1px solid #eadde1;

            border-radius: 10px;

            background: #fffdfd;

            color: #44383c;

            font-family: inherit;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #d85f7e;

            box-shadow:
                0 0 0 4px rgba(216,95,126,0.08);
        }


        /* ==========================
           BUTTON
        ========================== */

        .submit-button {
            width: 100%;
            height: 48px;

            margin-top: 5px;

            border: 0;
            border-radius: 10px;

            background: #d85f7e;

            color: white;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-button:hover {
            background: #b94b69;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* ==========================
           MESSAGE
        ========================== */

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 9px;

            font-size: 11px;
            line-height: 1.6;
        }

        .message.error {
            display: block;

            background: #fff0f0;

            color: #a94442;
        }

        .message.success {
            display: block;

            background: #eff9f0;

            color: #427547;
        }


        /* ==========================
           BOTTOM
        ========================== */

        .auth-note {
            margin-top: 20px;

            text-align: center;

            color: #9b8a90;

            font-size: 10px;
            line-height: 1.7;
        }


        @media (max-width: 550px) {

            .navbar {
                padding: 0 5%;
            }

            .brand-text small {
                display: none;
            }

            .auth-page {
                padding: 40px 18px;
            }

            .auth-card {
                padding: 24px 20px;
            }

            .auth-header h1 {
                font-size: 29px;
            }

        }

    </style>
</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a
            href="../index.html"
            class="brand"
        >

            <div class="brand-icon">
                学
            </div>

            <div class="brand-text">

                <strong>
                    Study with Jasmine
                </strong>

                <small>
                    和 Jasmine 一起学习吧！
                </small>

            </div>

        </a>


        <a
            href="index.html"
            class="back-button"
        >
            ← Materials
        </a>

    </header>



    <!-- AUTH -->

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-header">

                <div class="auth-logo">
                    学
                </div>

                <h1>
                    Welcome!
                </h1>

                <p>
                    Sign in to access your learning materials.
                </p>

            </div>



            <div class="auth-card">


                <!-- TABS -->

                <div class="auth-tabs">

                    <button
                        id="loginTab"
                        class="tab-button active"
                        type="button"
                    >
                        Log In
                    </button>

                    <button
                        id="signupTab"
                        class="tab-button"
                        type="button"
                    >
                        Sign Up
                    </button>

                </div>



                <!-- ======================
                     LOGIN FORM
                ======================= -->

                <form
                    id="loginForm"
                    class="auth-form active"
                >

                    <div class="form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            id="loginEmail"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        id="loginSubmit"
                        class="submit-button"
                        type="submit"
                    >
                        Log In
                    </button>


                    <div
                        id="loginMessage"
                        class="message"
                    ></div>

                </form>



                <!-- ======================
                     SIGN UP FORM
                ======================= -->

                <form
                    id="signupForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="signupName">
                            Name
                        </label>

                        <input
                            id="signupName"
                            type="text"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupEmail">
                            Email
                        </label>

                        <input
                            id="signupEmail"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            id="signupPassword"
                            type="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        id="signupSubmit"
                        class="submit-button"
                        type="submit"
                    >
                        Create Account
                    </button>


                    <div
                        id="signupMessage"
                        class="message"
                    ></div>

                </form>


            </div>


            <p class="auth-note">
                Your account keeps your purchased
                learning materials together in one place.
            </p>


        </div>

    </main>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script>

        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://eunvkjirdgovwgclqkcm.supabase.co";


        /*
            IMPORTANT:

            Paste the SAME Publishable Key
            that you used in materials.js.

            DO NOT use the Secret Key.
        */

        const SUPABASE_KEY =
            "sb_publishable_cvGGPzroACteZ2Y5bIYo8w_gUXkqtUV";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =========================================
           TABS
        ========================================= */

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");


        loginTab.addEventListener(
            "click",
            () => {

                loginTab.classList.add("active");

                signupTab.classList.remove("active");

                loginForm.classList.add("active");

                signupForm.classList.remove("active");

            }
        );


        signupTab.addEventListener(
            "click",
            () => {

                signupTab.classList.add("active");

                loginTab.classList.remove("active");

                signupForm.classList.add("active");

                loginForm.classList.remove("active");

            }
        );



        /* =========================================
           SIGN UP
        ========================================= */

        signupForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const name =
                    document
                        .getElementById("signupName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("signupPassword")
                        .value;


                const button =
                    document.getElementById(
                        "signupSubmit"
                    );


                const message =
                    document.getElementById(
                        "signupMessage"
                    );


                button.disabled = true;

                button.textContent =
                    "Creating account...";


                message.className = "message";

                message.textContent = "";


                const {
                    data,
                    error
                } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            name: name
                        }

                    }

                });


                button.disabled = false;

                button.textContent =
                    "Create Account";


                if (error) {

                    message.className =
                        "message error";

                    message.textContent =
                        error.message;

                    return;

                }


                message.className =
                    "message success";


                /*
                    If Supabase requires email
                    confirmation, session may be null.
                */

                if (data.session) {

                    message.textContent =
                        "Account created! Redirecting...";


                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        800
                    );

                } else {

                    message.textContent =
                        "Account created! Please check your email to confirm your account.";

                }

            }
        );



        /* =========================================
           LOGIN
        ========================================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                const button =
                    document.getElementById(
                        "loginSubmit"
                    );


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                message.className = "message";

                message.textContent = "";


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                button.disabled = false;

                button.textContent =
                    "Log In";


                if (error) {

                    message.className =
                        "message error";

                    message.textContent =
                        error.message;

                    return;

                }


                message.className =
                    "message success";

                message.textContent =
                    "Logged in! Redirecting...";


                setTimeout(
                    () => {

                        window.location.href =
                            "index.html";

                    },
                    600
                );

            }
        );

    </script>


</body>

</html>
