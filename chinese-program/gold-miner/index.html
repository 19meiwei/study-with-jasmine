nition.lang='zh-CN';recognition.interimResults=false;recognition.maxAlternatives=3;$('speechresult').textContent='Listening…';recognition.onresult=e=>{let heard=Array.from(e.results[0]).map(a=>a.transcript);if(heard.some(s=>normalize(s)===normalize(w[0]))){tone(880,.25);challengeIndex++;bossStep('')}else $('speechresult').textContent=`Heard: ${heard[0]}. Try again!`};recognition.onerror=e=>$('speechresult').textContent=`Microphone: ${e.error}. Try again or ask teacher.`;try{recognition.start()}catch(e){$('speechresult').textContent='Microphone could not start.'}}}
function finish(win){state='over';show(`<h2>${win?'🏆 Treasure champion!':'⏳ Time is up!'}</h2><p>You collected ${score} gold points.</p><button id="again">↻ Play again</button>`);$('again').onclick=newGame}
function poly(pts,fill,stroke='',width=2){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}

function drawItem(it){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(tick*.01+it.id)*.045);ellipse(5,it.r*.6,it.r*1.02,it.r*.5,'#110b2290');if(it.type==='rock'){poly([[-it.r*.85,-it.r*.42],[-it.r*.23,-it.r],[it.r*.63,-it.r*.77],[it.r,it.r*.18],[it.r*.42,it.r*.82],[-it.r*.76,it.r*.6]],'#626b82','#35384f',5);poly([[-it.r*.5,-it.r*.45],[-it.r*.18,-it.r*.76],[it.r*.4,-it.r*.6],[it.r*.55,-it.r*.2]],'#a6afc0');ctx.fillStyle='#f5f1fd';ctx.font='bold 17px Nunito';ctx.textAlign='center';ctx.fillText('说',0,8)}else if(it.type==='gem'){ctx.shadowColor='#6ffaff';ctx.shadowBlur=18;poly([[0,-it.r*1.2],[it.r*.9,-it.r*.25],[it.r*.65,it.r*.7],[0,it.r*1.1],[-it.r*.85,it.r*.55],[-it.r*.8,-it.r*.35]],'#27d4e4','#d2ffff',4);poly([[0,-it.r*1.2],[0,it.r*1.1],[-it.r*.8,-it.r*.35]],'#a8faff');poly([[0,-it.r*1.2],[it.r*.9,-it.r*.25],[0,it.r*1.1]],'#19a5dc')}else{ctx.shadowColor='#fbb73c';ctx.shadowBlur=12;poly([[-it.r*.85,-it.r*.45],[-it.r*.35,-it.r],[it.r*.48,-it.r*.88],[it.r,it.r*.06],[it.r*.58,it.r*.75],[-it.r*.3,it.r*.92],[-it.r,it.r*.32]],'#ed9c28','#8d4e29',5);poly([[-it.r*.58,-it.r*.45],[-it.r*.23,-it.r*.77],[it.r*.43,-it.r*.63],[it.r*.64,-it.r*.1],[-it.r*.18,it.r*.18]],'#ffe16b');poly([[it.r*.07,it.r*.4],[it.r*.7,it.r*.12],[it.r*.46,it.r*.58],[-it.r*.26,it.r*.74]],'#ffc046')}ctx.restore()}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6a507c');g.addColorStop(.4,'#966d80');g.addColorStop(.401,'#6d4b60');g.addColorStop(1,'#201a39');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);circle(895,74,39,'#ffe7aa');for(let layer=0;layer<3;layer++){let pts=[[0,190]];for(let x=0;x<=W+130;x+=125)pts.push([x,110+layer*36+(Math.sin(x*.017+layer)*38)]);pts.push([W,212],[0,212]);poly(pts,['#614763','#74536a','#876174'][layer])}ctx.fillStyle='#c48b52';ctx.fillRect(0,187,W,22);ctx.fillStyle='#9a6c45';ctx.fillRect(0,207,W,7);for(let i=0;i<105;i++){let x=(i*179+47)%W,y=220+(i*97)%(H-225);circle(x,y,i%5===0?3:1.4,i%3===0?'#c09a7d70':'#b89bcb45')}for(let it of items)drawItem(it);drawPanda();let hx=ox+Math.sin(angle)*hook.len,hy=oy+Math.cos(angle)*hook.len;ctx.strokeStyle='#1a1025';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(hx,hy);ctx.stroke();ctx.strokeStyle='#e8d9c6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(hx,hy);ctx.stroke();ctx.save();ctx.translate(hx,hy);ctx.rotate(-angle);ctx.strokeStyle='#b9c6d2';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-19,-10);ctx.lineTo(-18,10);ctx.quadraticCurveTo(0,34,18,10);ctx.lineTo(19,-10);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();particles.forEach(p=>{circle(p.x,p.y,Math.max(1,p.life/12),p.color);p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--});particles=particles.filter(p=>p.life>0);if(state==='play'){ctx.textAlign='center';ctx.font='bold 19px Nunito';ctx.fillStyle='#fff0c8';ctx.fillText('✨ Catch gold, gems & conversation rocks ✨',W/2,247)}}
function frame(t){let dt=Math.min(.04,(t-(last||t))/1000);last=t;tick++;if(state==='play'){time-=dt;if(time<=0){time=0;finish(false)}if(hook.mode==='swing')angle=Math.sin(t*.0017)*1.22;else if(hook.mode==='out'){hook.len+=dt*560;let hx=ox+Math.sin(angle)*hook.len,hy=oy+Math.cos(angle)*hook.len;let hit=items.find(it=>Math.hypot(hx-it.x,hy-it.y)<it.r+13);if(hit){hook.item=hit;hook.mode='back';items=items.filter(it=>it!==hit);tone(510,.14)}else if(hook.len>MAXLEN||hx<15||hx>W-15||hy>H-15)hook.mode='back'}else if(hook.mode==='back'){hook.len-=dt*(hook.item?(hook.item.type==='rock'?165:hook.item.type==='gem'?300:220):550);if(hook.item){hook.item.x=ox+Math.sin(angle)*hook.len;hook.item.y=oy+Math.cos(angle)*hook.len}if(hook.len<=46){let caught=hook.item;hook.len=46;hook.item=null;hook.mode='swing';if(caught)ask(caught)}}if(items.length<5&&state==='play')spawn();update()}draw();requestAnimationFrame(frame)}$('restart').onclick=newGame;$('drop').onclick=drop;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♫ Sound OFF':'♫ Sound ON';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};C.onclick=drop;window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();drop()}});newGame(1);requestAnimationFrame(frame);
